<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drum Machine</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="device" id="drum-machine">
      <div class="pads" id="pad-bank">
        <button class="pad drum-pad" id="Heater-1">
          Q
          <audio
            class="clip"
            id="Q"
            src="https://cdn.freecodecamp.org/curriculum/drum/Heater-1.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Heater-2">
          W
          <audio
            class="clip"
            id="W"
            src="https://cdn.freecodecamp.org/curriculum/drum/Heater-2.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Heater-3">
          E
          <audio
            class="clip"
            id="E"
            src="https://cdn.freecodecamp.org/curriculum/drum/Heater-3.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Heater-4">
          A
          <audio
            class="clip"
            id="A"
            src="https://cdn.freecodecamp.org/curriculum/drum/Heater-4_1.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Clap">
          S
          <audio
            class="clip"
            id="S"
            src="https://cdn.freecodecamp.org/curriculum/drum/Heater-6.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Open-HH">
          D
          <audio
            class="clip"
            id="D"
            src="https://cdn.freecodecamp.org/curriculum/drum/Dsc_Oh.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Kick-n-Hat">
          Z
          <audio
            class="clip"
            id="Z"
            src="https://cdn.freecodecamp.org/curriculum/drum/Kick_n_Hat.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Kick">
          X
          <audio
            class="clip"
            id="X"
            src="https://cdn.freecodecamp.org/curriculum/drum/RP4_KICK_1.mp3"
          ></audio>
        </button>
        <button class="pad drum-pad" id="Closed-HH">
          C
          <audio
            class="clip"
            id="C"
            src="https://cdn.freecodecamp.org/curriculum/drum/Cev_H2.mp3"
          ></audio>
        </button>
      </div>

      <div class="row">
        <span class="label">Power: On</span>
        <button
          class="switch on"
          onclick="this.classList.toggle('on')"
        ></button>
      </div>

      <p class="screen" id="display"></p>

      <div class="volume-block">
        <div class="volume-label">Volume</div>
        <input type="range" min="0" max="100" value="50" />
      </div>

      <div class="row">
        <span class="label">Bank: Heater Kit</span>
        <button
          class="switch on"
          onclick="this.classList.toggle('on')"
        ></button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
